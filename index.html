let activeCat="Tümü", favorites=JSON.parse(localStorage.getItem("haileyFavs")||"[]"), favoritesMode=false;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("haileyFavs",JSON.stringify(favorites));$("favCount").textContent=favorites.length}
function cats(){
 const unique=[...new Set(cases.map(x=>x.category))];
 $("category").innerHTML='<option value="Tümü">Tüm kategoriler</option>'+unique.map(x=>`<option>${esc(x)}</option>`).join("");
 $("cats").innerHTML=unique.map(x=>`<button class="cat" data-cat="${esc(x)}">${esc(x)}</button>`).join("");
 document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;favoritesMode=false;document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("category").value=activeCat;render()});
 $("category").onchange=e=>{activeCat=e.target.value;favoritesMode=false;document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("active",x.dataset.cat===activeCat));render()};
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
 const q=$("search").value.toLocaleLowerCase("tr-TR");
 let arr=cases.filter(c=>(activeCat==="Tümü"||c.category===activeCat)&&(!q||c.title.toLocaleLowerCase("tr-TR").includes(q)||c.commands.join(" ").toLocaleLowerCase("tr-TR").includes(q)));
 if(favoritesMode)arr=arr.filter(c=>favorites.includes(c.id));
 $("total").textContent=cases.length;$("shown").textContent=arr.length;save();
 $("grid").innerHTML=arr.length?arr.map(c=>`<article class="card"><span class="badge">${esc(c.category)}</span><h2>${esc(c.title)}</h2><div class="count">${c.commands.length} emote satırı</div><div class="actions"><button class="primary" onclick="openCase(${c.id})">Emoteleri aç</button><button onclick="toggleFav(${c.id})">${favorites.includes(c.id)?"★":"☆"}</button></div></article>`).join(""):'<div class="empty">Bu filtreyle eşleşen vaka bulunamadı.</div>';
}
function openCase(id){
 const c=cases.find(x=>x.id===id);if(!c)return;
 $("modalBadge").textContent=c.category;$("modalTitle").textContent=c.title;
 $("modalBody").innerHTML=c.commands.map((x,i)=>`<div class="cmdrow"><div class="cmd ${x.startsWith("/me")?"me":"do"}" id="cmd-${id}-${i}">${esc(x)}</div><button class="copyone" onclick="copyText(cases.find(x=>x.id===${id}).commands[${i}])">Kopyala</button></div>`).join("")+
 `<div class="actions"><button class="primary" onclick="copyAll(${id})">Tümünü kopyala</button><button onclick="toggleFav(${id})">${favorites.includes(id)?"★ Favoriden çıkar":"☆ Favoriye ekle"}</button></div>`;
 $("modal").classList.add("open");
}
function closeModal(){$("modal").classList.remove("open")}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast("Kopyalandı ✓"))}
function copyAll(id){const c=cases.find(x=>x.id===id);copyText(c.commands.join("\n"))}
function toggleFav(id){favorites.includes(id)?favorites=favorites.filter(x=>x!==id):favorites.push(id);save();render();if($("modal").classList.contains("open"))openCase(id)}
function showFavorites(){favoritesMode=true;activeCat="Tümü";document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("active",x.dataset.cat==="Tümü"));$("category").value="Tümü";render()}
function clearFavorites(){favorites=[];save();render()}
function toast(t){const x=document.createElement("div");x.textContent=t;x.style="position:fixed;right:20px;bottom:20px;background:#17212d;border:1px solid #34475b;padding:12px 16px;border-radius:10px;z-index:50";document.body.appendChild(x);setTimeout(()=>x.remove(),1300)}
$("search").oninput=render;cats();render();
</script>
